group 'com.example.payu_mobile_payments_android'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '2.1.20'
    ext.wallet_version = '19.1.0'

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.6.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

// AGP 9 provides Kotlin support natively unless the consuming app opts out with
// android.builtInKotlin=false, which is what `flutter create` writes by default.
def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0].toInteger()
def builtInKotlinProperty = providers.gradleProperty('android.builtInKotlin').getOrNull()
// Note: `builtInKotlinProperty?.toBoolean() ?: true` would be wrong here - Groovy's elvis
// operator treats `false` itself as falsy, so an explicit `android.builtInKotlin=false` would
// be overridden back to `true`, unlike Kotlin's null-only elvis operator used in similar
// Kotlin DSL plugin migrations.
def builtInKotlinEnabled = agpMajor >= 9 &&
    (builtInKotlinProperty == null ? true : builtInKotlinProperty.toBoolean())

if (!builtInKotlinEnabled) {
    apply plugin: 'kotlin-android'
}

project.extensions.configure(org.jetbrains.kotlin.gradle.dsl.KotlinAndroidProjectExtension) { ext ->
    ext.compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11)
}

android {
    compileSdkVersion 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdkVersion 19
    }

    namespace "com.example.payu_mobile_payments_android"
}

dependencies {
    implementation "com.google.android.gms:play-services-wallet:$wallet_version"
}
